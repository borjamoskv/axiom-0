name: CI (Zero-Anergy Invariants)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  audit:
    name: Verification & Falsification Suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: aarch64-unknown-none

      - name: Install QEMU and native C compiler
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y qemu-system-arm build-essential python3

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Validate core and firmware
        run: python3 validate.py
