name: CI (Zero-Anergy Invariants)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  audit:
    name: Verification & Falsification Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Enforce Formatting (cargo fmt)
        run: cargo fmt --all -- --check

      - name: Static Analysis (cargo clippy)
        run: cargo clippy --all-targets -- -D warnings

      - name: Run Test Suite (cargo test)
        run: cargo test --all-targets

      - name: Run Stress Tests (10k Popperian)
        run: cargo run --release --example stress_popperian_10k
